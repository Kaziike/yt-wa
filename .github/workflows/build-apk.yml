name: Build LiteTube APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra cú pháp JavaScript Scriptlets
        run: |
          for f in app/src/main/assets/scriptlets/*.js; do
            node --check "$f"
          done

      - name: Thiết lập môi trường Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Thiết lập Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cấp quyền thực thi cho gradlew
        run: chmod +x gradlew || true

      - name: Chạy Unit Test và đóng gói Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Tải file APK lên Artifacts để tải về điện thoại
        uses: actions/upload-artifact@v4
        with:
          name: LiteTube-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
