name: Build YouTube Lite APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên web GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Thiết lập Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cấp quyền thực thi cho gradlew
        run: chmod +x gradlew || true

      - name: Compile và đóng gói file APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Tải file APK lên Artifacts để tải về điện thoại
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeLite-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
